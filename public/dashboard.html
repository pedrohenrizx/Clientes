<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomerFlow Analytics - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">
    <nav class="bg-white dark:bg-gray-800 shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">CustomerFlow</h1>
        <div class="flex items-center space-x-4">
            <span id="user-status" class="text-sm font-medium"></span>
            <button id="theme-toggle" class="p-2 rounded bg-gray-200 dark:bg-gray-700">Toggle Dark Mode</button>
            <a href="/subscription" class="text-blue-600 dark:text-blue-400 hover:underline">Upgrade</a>
            <a href="/contact" class="text-blue-600 dark:text-blue-400 hover:underline">Support</a>
            <button id="logout-btn" class="text-red-600 dark:text-red-400 hover:underline">Logout</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-4">
        <div class="flex justify-between items-center mb-6">
             <h2 class="text-2xl font-semibold">Dashboard Overview</h2>
             <button id="download-report" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Download Report</button>
        </div>

        <div id="download-msg" class="mb-4 text-sm font-semibold hidden"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                <h3 class="text-sm text-gray-500 dark:text-gray-400">Total Active Customers</h3>
                <p class="text-2xl font-bold">1,245</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                <h3 class="text-sm text-gray-500 dark:text-gray-400">Conversion Rate</h3>
                <p class="text-2xl font-bold">12.4%</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                <h3 class="text-sm text-gray-500 dark:text-gray-400">Avg Revenue / Customer</h3>
                <p class="text-2xl font-bold">R$ 350</p>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                <h3 class="text-sm text-gray-500 dark:text-gray-400">Retention Rate</h3>
                <p class="text-2xl font-bold">85%</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                <h3 class="text-lg font-semibold mb-4">Customer Growth</h3>
                <canvas id="growthChart"></canvas>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                <h3 class="text-lg font-semibold mb-4">Customer Segments</h3>
                <canvas id="segmentChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const uid = localStorage.getItem('uid');
        const token = localStorage.getItem('token');
        if (!uid || !token) {
            window.location.href = '/';
        }

        // Fetch User Info
        fetch(`/api/user/${uid}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        })
            .then(res => res.json())
            .then(data => {
                if(data.user) {
                     document.getElementById('user-status').textContent = data.user.is_pro ? 'PRO User' : 'FREE User';
                     document.getElementById('user-status').classList.add(data.user.is_pro ? 'text-green-500' : 'text-gray-500');
                }
            });

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('uid');
            window.location.href = '/';
        });

        // Download Report
        document.getElementById('download-report').addEventListener('click', async () => {
             const response = await fetch('/api/download', {
                 method: 'POST',
                 headers: {
                     'Content-Type': 'application/json',
                     'Authorization': `Bearer ${token}`
                 },
                 body: JSON.stringify({})
             });
             const result = await response.json();
             const msgDiv = document.getElementById('download-msg');
             msgDiv.classList.remove('hidden', 'text-green-500', 'text-red-500');
             if(result.success) {
                 msgDiv.textContent = result.message + " (Simulated)";
                 msgDiv.classList.add('text-green-500');
             } else {
                 msgDiv.textContent = result.error;
                 msgDiv.classList.add('text-red-500');
             }
        });

        // Charts Initialization
        const growthCtx = document.getElementById('growthChart').getContext('2d');
        new Chart(growthCtx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'New Customers',
                    data: [65, 59, 80, 81, 56, 120],
                    borderColor: 'rgb(75, 192, 192)',
                    tension: 0.1
                }]
            }
        });

        const segmentCtx = document.getElementById('segmentChart').getContext('2d');
        new Chart(segmentCtx, {
            type: 'doughnut',
            data: {
                labels: ['New', 'Returning', 'Inactive'],
                datasets: [{
                    data: [300, 50, 100],
                    backgroundColor: ['rgb(54, 162, 235)', 'rgb(255, 205, 86)', 'rgb(255, 99, 132)']
                }]
            }
        });
    </script>
</body>
</html>
