<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomerFlow Analytics - Subscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200 min-h-screen">
    <nav class="bg-white dark:bg-gray-800 shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold"><a href="/dashboard">CustomerFlow</a></h1>
        <div class="flex items-center space-x-4">
            <a href="/dashboard" class="text-blue-600 dark:text-blue-400 hover:underline">Dashboard</a>
            <button id="theme-toggle" class="p-2 rounded bg-gray-200 dark:bg-gray-700">Toggle Dark Mode</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-8 flex justify-center">
        <div class="max-w-lg w-full bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-center">Upgrade to Pro</h2>
            <p class="text-center mb-6">Get unlimited downloads and messages for only R$ 5,00/month.</p>

            <form id="form-checkout" class="space-y-4">
                <div>
                    <label for="form-checkout__cardNumber" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Card Number</label>
                    <div id="form-checkout__cardNumber" class="mt-1 block w-full h-10 border-gray-300 rounded-md shadow-sm bg-gray-50 dark:bg-gray-700"></div>
                </div>
                <div>
                    <label for="form-checkout__expirationDate" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Expiration Date</label>
                    <div id="form-checkout__expirationDate" class="mt-1 block w-full h-10 border-gray-300 rounded-md shadow-sm bg-gray-50 dark:bg-gray-700"></div>
                </div>
                <div>
                    <label for="form-checkout__securityCode" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Security Code</label>
                    <div id="form-checkout__securityCode" class="mt-1 block w-full h-10 border-gray-300 rounded-md shadow-sm bg-gray-50 dark:bg-gray-700"></div>
                </div>
                <div>
                    <label for="form-checkout__cardholderName" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Cardholder Name</label>
                    <input type="text" id="form-checkout__cardholderName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100" />
                </div>
                <div>
                    <label for="form-checkout__cardholderEmail" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Email</label>
                    <input type="email" id="form-checkout__cardholderEmail" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100" />
                </div>
                <div class="grid grid-cols-2 gap-4">
                     <div>
                        <label for="form-checkout__identificationType" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Document Type</label>
                        <select id="form-checkout__identificationType" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100"></select>
                    </div>
                    <div>
                        <label for="form-checkout__identificationNumber" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Document Number</label>
                        <input type="text" id="form-checkout__identificationNumber" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100" />
                    </div>
                </div>
                <div class="hidden">
                     <select id="form-checkout__issuer" name="issuer"></select>
                     <select id="form-checkout__installments" name="installments"></select>
                </div>

                <button type="submit" id="form-checkout__submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mt-4">
                    Pay R$ 5,00
                </button>
            </form>

            <div id="payment-message" class="mt-4 text-center font-bold hidden"></div>
        </div>
    </div>

    <script>
        const uid = localStorage.getItem('uid');
        const token = localStorage.getItem('token');
        if (!uid || !token) {
            window.location.href = '/';
        }

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        const mp = new MercadoPago('APP_USR-41faf100-54c5-4af8-9b0f-94f7a51c9521');
        const cardForm = mp.cardForm({
            amount: "5.00",
            iframe: true,
            form: {
                id: "form-checkout",
                cardNumber: {
                    id: "form-checkout__cardNumber",
                    placeholder: "Card Number",
                },
                expirationDate: {
                    id: "form-checkout__expirationDate",
                    placeholder: "MM/YY",
                },
                securityCode: {
                    id: "form-checkout__securityCode",
                    placeholder: "CVC",
                },
                cardholderName: {
                    id: "form-checkout__cardholderName",
                    placeholder: "Cardholder Name",
                },
                issuer: {
                    id: "form-checkout__issuer",
                    placeholder: "Issuer",
                },
                installments: {
                    id: "form-checkout__installments",
                    placeholder: "Installments",
                },
                identificationType: {
                    id: "form-checkout__identificationType",
                    placeholder: "Document Type",
                },
                identificationNumber: {
                    id: "form-checkout__identificationNumber",
                    placeholder: "Document Number",
                },
                cardholderEmail: {
                    id: "form-checkout__cardholderEmail",
                    placeholder: "Email",
                },
            },
            callbacks: {
                onFormMounted: error => {
                    if (error) return console.warn("Form Mounted handling error: ", error);
                    console.log("Form mounted");
                },
                onSubmit: event => {
                    event.preventDefault();

                    const {
                        paymentMethodId: payment_method_id,
                        issuerId: issuer_id,
                        cardholderEmail: email,
                        amount,
                        token,
                        installments,
                        identificationNumber,
                        identificationType,
                    } = cardForm.getCardFormData();

                    fetch("/api/process_payment", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            token,
                            issuer_id,
                            payment_method_id,
                            transaction_amount: Number(amount),
                            installments: Number(installments),
                            payer: {
                                email,
                                identification: {
                                    type: identificationType,
                                    number: identificationNumber,
                                },
                            },
                        }),
                    })
                    .then(response => response.json())
                    .then(result => {
                         const msgDiv = document.getElementById('payment-message');
                         msgDiv.classList.remove('hidden', 'text-green-500', 'text-red-500');
                         if(result.success) {
                             msgDiv.textContent = result.message;
                             msgDiv.classList.add('text-green-500');
                             setTimeout(() => { window.location.href = '/dashboard'; }, 2000);
                         } else {
                             msgDiv.textContent = result.message || 'Payment failed';
                             msgDiv.classList.add('text-red-500');
                         }
                    })
                    .catch(error => {
                        console.error("Error fetching payment endpoint:", error);
                    });
                },
                onFetching: (resource) => {
                    console.log("Fetching resource: ", resource);
                }
            },
        });
    </script>
</body>
</html>
