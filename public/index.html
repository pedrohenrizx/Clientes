<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomerFlow Analytics - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md text-center">
        <h1 class="text-3xl font-bold mb-4">CustomerFlow Analytics</h1>
        <p class="text-sm md:text-base mb-8">Gerencie seus clientes de forma eficiente e tome decisões estratégicas baseadas em dados.</p>

        <button id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition-colors duration-200">
            Entrar com Google
        </button>

        <p id="error-message" class="text-red-500 text-sm mt-4 hidden"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC8TFitMZgSTmxTTIaeCznwN2CpzWoQ6Bc",
            authDomain: "booksdev-3de79.firebaseapp.com",
            databaseURL: "https://booksdev-3de79-default-rtdb.firebaseio.com",
            projectId: "booksdev-3de79",
            storageBucket: "booksdev-3de79.firebasestorage.app",
            messagingSenderId: "39273829148",
            appId: "1:39273829148:web:cbb6d02d4597025e09a0d9",
            measurementId: "G-5Q3BCRZEBZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        document.getElementById('login-btn').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Sync user with backend
                const idToken = await user.getIdToken();
                localStorage.setItem('token', idToken);

                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({
                        email: user.email,
                        displayName: user.displayName || 'User'
                    })
                });

                if (response.ok) {
                    localStorage.setItem('uid', user.uid);
                    window.location.href = '/dashboard';
                } else {
                    document.getElementById('error-message').textContent = 'Erro ao sincronizar usuário. Tente novamente.';
                    document.getElementById('error-message').classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                document.getElementById('error-message').textContent = 'Erro ao fazer login com Google.';
                document.getElementById('error-message').classList.remove('hidden');
            }
        });

        // redirect if already logged in
        if (localStorage.getItem('uid')) {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>
