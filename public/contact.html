<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomerFlow Analytics - Contact</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200 flex flex-col min-h-screen">
    <nav class="bg-white dark:bg-gray-800 shadow-md p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-blue-600 dark:text-blue-400"><a href="/dashboard">CustomerFlow</a></h1>
        <div class="flex items-center space-x-4">
            <a href="/dashboard" class="text-blue-600 dark:text-blue-400 hover:underline">Dashboard</a>
            <button id="theme-toggle" class="p-2 rounded bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600" aria-label="Toggle Theme">🌓</button>
        </div>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2"></div>

    <div class="container mx-auto p-4 mt-8 flex-grow">
        <div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">Contact Support</h2>
            <p class="mb-6">Need help? Send us a message.</p>

            <div class="mb-8 space-y-2">
                <p><strong>Email:</strong> <a href="mailto:pedrohenri.craftmourazx@gmail.com" class="text-blue-600 dark:text-blue-400">pedrohenri.craftmourazx@gmail.com</a></p>
                <p><strong>WhatsApp:</strong> <a href="https://wa.me/5522992685896" target="_blank" class="text-green-600 dark:text-green-400">(22) 99268-5896</a></p>
            </div>

            <form id="contact-form" class="space-y-4" novalidate>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Message</label>
                    <textarea id="message" rows="5" placeholder="How can we help you?" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors" required></textarea>
                    <p id="message-error" class="text-red-500 text-xs mt-1 hidden">Message is required.</p>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition-colors duration-200 flex justify-center items-center">
                    <span>Send Message</span>
                    <svg id="submit-spinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <footer class="bg-white dark:bg-gray-800 shadow-md mt-8 py-6">
        <div class="container mx-auto px-4 text-center text-sm text-gray-500 dark:text-gray-400">
            &copy; 2024 CustomerFlow Analytics. All rights reserved. 100% Free Forever.
        </div>
    </footer>

    <script>
        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            toast.className = `${bgColor} text-white px-6 py-3 rounded shadow-lg transform transition-all duration-300 translate-y-full opacity-0 flex items-center`;

            const icon = type === 'success'
                ? `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`
                : `<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-full', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const uid = localStorage.getItem('uid');
        const token = localStorage.getItem('token');
        if (!uid || !token) {
            window.location.href = '/';
        }

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageInput = document.getElementById('message');
            const messageError = document.getElementById('message-error');
            const submitBtn = document.getElementById('submit-btn');
            const submitSpinner = document.getElementById('submit-spinner');

            const message = messageInput.value.trim();

            if (!message) {
                messageInput.classList.add('border-red-500');
                messageError.classList.remove('hidden');
                return;
            } else {
                messageInput.classList.remove('border-red-500');
                messageError.classList.add('hidden');
            }

            // Loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            submitSpinner.classList.remove('hidden');

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message })
                });

                const result = await response.json();

                if (response.ok) {
                    showToast(result.message, 'success');
                    messageInput.value = '';
                } else {
                    showToast(result.error || 'Failed to send message', 'error');
                }
            } catch (error) {
                showToast('Network error, please try again.', 'error');
                console.error("Error sending message:", error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                submitSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
