<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomerFlow Analytics - Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200 min-h-screen">
    <nav class="bg-white dark:bg-gray-800 shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold"><a href="/dashboard">CustomerFlow</a></h1>
        <div class="flex items-center space-x-4">
            <a href="/dashboard" class="text-blue-600 dark:text-blue-400 hover:underline">Dashboard</a>
            <button id="theme-toggle" class="p-2 rounded bg-gray-200 dark:bg-gray-700">Toggle Dark Mode</button>
        </div>
    </nav>

    <div class="container mx-auto p-4 mt-8">
        <div class="max-w-2xl mx-auto bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4">Contact Support</h2>
            <p class="mb-6">Need help? Send us a message.</p>

            <div class="mb-8 space-y-2">
                <p><strong>Email:</strong> <a href="mailto:pedrohenri.craftmourazx@gmail.com" class="text-blue-600 dark:text-blue-400">pedrohenri.craftmourazx@gmail.com</a></p>
                <p><strong>WhatsApp:</strong> <a href="https://wa.me/5522992685896" target="_blank" class="text-green-600 dark:text-green-400">(22) 99268-5896</a></p>
            </div>

            <form id="contact-form" class="space-y-4">
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Message</label>
                    <textarea id="message" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-gray-100" required></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Send Message
                </button>
            </form>

            <div id="contact-message" class="mt-4 text-center font-bold hidden"></div>
        </div>
    </div>

    <script>
        const uid = localStorage.getItem('uid');
        const token = localStorage.getItem('token');
        if (!uid || !token) {
            window.location.href = '/';
        }

        // Theme Toggle
        const themeToggleBtn = document.getElementById('theme-toggle');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        document.getElementById('contact-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('message').value;

            try {
                const response = await fetch('/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message })
                });

                const result = await response.json();
                const msgDiv = document.getElementById('contact-message');
                msgDiv.classList.remove('hidden', 'text-green-500', 'text-red-500');

                if (response.ok) {
                    msgDiv.textContent = result.message;
                    msgDiv.classList.add('text-green-500');
                    document.getElementById('message').value = '';
                } else {
                    msgDiv.textContent = result.error;
                    msgDiv.classList.add('text-red-500');
                }
            } catch (error) {
                console.error("Error sending message:", error);
            }
        });
    </script>
</body>
</html>
